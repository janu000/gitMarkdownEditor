        // --- Utility: Simple Markdown Parser (Fallback if marked.js fails) ---
        const fallbackParse = (md) => {
          if (!md) return '';
          let html = md.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-100 dark:bg-gray-800 p-4 rounded-md overflow-x-auto my-4 text-sm font-mono text-gray-900 dark:text-gray-200"><code>$1</code></pre>');
          html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded text-sm text-pink-600 dark:text-pink-400 font-mono">$1</code>');
          html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-gray-900 dark:text-white">$1</strong>');
          html = html.replace(/\*([^*]+)\*/g, '<em class="italic">$1</em>');
          html = html.replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-3 text-gray-900 dark:text-white">$1</h3>');
          html = html.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4 pb-2 border-b border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white">$1</h2>');
          html = html.replace(/^# (.*$)/gim, '<h1 class="text-4xl font-extrabold mt-6 mb-6 text-gray-900 dark:text-white">$1</h1>');
          html = html.replace(/^\> (.*$)/gim, '<blockquote class="border-l-4 border-indigo-500 pl-4 py-1 my-4 text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-800/50 rounded-r">$1</blockquote>');
          html = html.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="max-w-full rounded-lg my-4 shadow-md" />');
          html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 underline underline-offset-2" target="_blank">$1</a>');
          html = html.replace(/^\s*-\s(.*$)/gim, '<li class="ml-4 list-disc mb-1">$1</li>');
          html = html.replace(/<\/li>\n<li/g, '</li><li'); 
          return `<div class="space-y-4 text-gray-800 dark:text-gray-300 leading-relaxed">${html.split('\n\n').map(p => {
            if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<blockquote') || p.startsWith('<li')) return p;
            return `<p>${p}</p>`;
          }).join('')}</div>`;

A powerful, browser-based Markdown editor with seamless GitHub integration for syncing and managing your documentation directly from your browser.

## Features

✨ **Rich Markdown Editing**

## Getting Started

### Prerequisites
- A modern web browser (Chrome, Firefox, Safari, Edge)
- A GitHub Personal Access Token (for GitHub sync features)

### Usage

1. **Open the editor**: Simply open \`main.html\` in your web browser
2. **Connect GitHub (optional)**:
   - Click "Connect Account" in the sidebar
   - Enter your GitHub Personal Access Token (classic) with \`repo\` scope
   - Your repositories will load automatically

3. **Start editing**:
   - Write or paste Markdown in the editor
   - See live preview in real-time
   - Use the toolbar for quick formatting

4. **GitHub Sync**:
   - Click on a repository in the sidebar
   - Browse and select files to edit
   - Make changes in the editor
   - Click "Save to GitHub" to commit changes

## Creating a GitHub Personal Access Token

To enable GitHub synchronization:

1. Go to GitHub Settings → Developer settings → [Personal access tokens](https://github.com/settings/tokens)
2. Click "Generate new token (classic)"
3. Set the scope to \`repo\` (Full control of private repositories)
4. Copy the token and paste it into Git Markdown Editor

⚠️ **Security Note**: Keep your token private. It's stored in your browser's localStorage and never sent to external servers (only to GitHub's official API).

Git Markdown Editor stores the following in your browser's localStorage for persistence:

- \`gme_hidden_repos\`: List of hidden repositories

          useEffect(() => {
            const handleMouseMove = (e) => {
              if (isResizingSidebar) {
                const newWidth = Math.max(150, Math.min(e.clientX, 600));
                setSidebarWidth(newWidth);
              }
              if (isResizingSplit) {
                const mainArea = editorRef.current?.parentElement?.parentElement;
                if (mainArea) {
                  const rect = mainArea.getBoundingClientRect();
                  const relativeX = e.clientX - rect.left;
                  const newRatio = Math.max(0.2, Math.min(relativeX / rect.width, 0.8));
                  setSplitRatio(newRatio);
                }
              }
            };

            const handleMouseUp = () => {
              setIsResizingSidebar(false);
              setIsResizingSplit(false);
              document.body.style.cursor = 'default';
              document.body.style.userSelect = 'auto';
            };

            if (isResizingSidebar || isResizingSplit) {
              window.addEventListener('mousemove', handleMouseMove);
              window.addEventListener('mouseup', handleMouseUp);
              document.body.style.userSelect = 'none';
            }

            return () => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            };
          }, [isResizingSidebar, isResizingSplit]);

          useEffect(() => {
            const root = window.document.documentElement;
            if (theme === 'dark') {
              root.classList.add('dark');
            } else {
              root.classList.remove('dark');
            }
            localStorage.setItem('theme', theme);
          }, [theme]);

          // --- Keyboard Shortcuts ---
          useEffect(() => {
            const handleKeyDown = (e) => {
              const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
              const isCtrlOrCmd = isMac ? e.metaKey : e.ctrlKey;

              // --- File Operations ---
              // Ctrl/Cmd + S (Save/Commit)
              if (isCtrlOrCmd && e.key === 's') {
                e.preventDefault();
                saveToGitHub();
              }
              // Ctrl/Cmd + P (Export to PDF)
              if (isCtrlOrCmd && e.key === 'p') {
                e.preventDefault();
                handleExportPdf();
              }

              // --- Text Formatting ---
              // Ctrl/Cmd + B (Bold)
              if (isCtrlOrCmd && e.key === 'b') {
                e.preventDefault();
                insertText('**', '**', 'bold text');
              }
              // Ctrl/Cmd + I (Italic)
              if (isCtrlOrCmd && e.key === 'i') {
                e.preventDefault();
                insertText('*', '*', 'italic text');
              }
              // Ctrl/Cmd + Shift + S (Strikethrough)
              if (isCtrlOrCmd && e.shiftKey && e.key === 'S') { // Note: 'S' for Shift + s
                e.preventDefault();
                insertText('~~', '~~', 'strikethrough text');
              }

              // Ctrl/Cmd + K (Link)
              if (isCtrlOrCmd && e.key === 'k') {
                e.preventDefault();
                insertText('[', '](url)', 'link text');
              }
              // Ctrl/Cmd + Alt + I (Image)
              if (isCtrlOrCmd && e.altKey && e.key === 'i') {
                e.preventDefault();
                insertText('![alt text](', ')', 'image url');
              }

              // --- Structural Elements ---

                insertListItem('- ', 'List item');

              // Ctrl/Cmd + Alt + C (Code Block)

                e.preventDefault();

              }
              // Ctrl/Cmd + Alt + ` (Inline Code) - Note: backtick key can be tricky, check e.key

            };

            window.addEventListener('keydown', handleKeyDown);

            return () => {

              if (window.marked && window.katex) {

                const blockMath = {

                  start(src) { return src.indexOf('$$'); },
                  tokenizer(src) {
                    const match = /^\$\$([\s\S]+?)\$\$/.exec(src);

                    const match = /^\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$/.exec(src);
                    if (match) return { type: 'inlineMath', raw: match[0], text: match[1] };
                  },

                  }

          // --- Toolbar Actions ---
          const insertText = (before, after = '', defaultText = '') => {
            const textarea = editorRef.current;
            if (!textarea) return;
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end) || defaultText;
            
            const newText = textarea.value.substring(0, start) + before + selectedText + after + textarea.value.substring(end);
            setContent(newText);
            
            setTimeout(() => {
              textarea.focus();
              textarea.setSelectionRange(start + before.length, start + before.length + selectedText.length);
            }, 0);
          };

          const insertListItem = (prefix, defaultText = '') => {
            const textarea = editorRef.current;
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            let selectedText = textarea.value.substring(start, end);
            let newContent;
            let newSelectionStart;
            let newSelectionEnd;

            if (selectedText.length === 0) {
                // No selection, insert prefix + defaultText
                newContent = prefix + defaultText;
                newSelectionStart = start + prefix.length;
                newSelectionEnd = newSelectionStart + defaultText.length;
            } else {
                // Multi-line selection
                const lines = selectedText.split('\n');
                const prefixedLines = lines.map(line => {
                    // Only add prefix if line is not empty and doesn't already start with the prefix
                    if (line.trim().length > 0 && !line.trim().startsWith(prefix.trim())) {
                        return prefix + line;
                    }
                    return line;
                });
                newContent = prefixedLines.join('\n');
                newSelectionStart = start;
                newSelectionEnd = start + newContent.length; // Select the newly formatted text
            }

            const newValue = textarea.value.substring(0, start) + newContent + textarea.value.substring(end);
            setContent(newValue);

            setTimeout(() => {
                textarea.focus();
                textarea.setSelectionRange(newSelectionStart, newSelectionEnd);
            }, 0);
          };

          const insertNumberedList = (startNumber = 1, defaultText = 'Numbered item') => {
            const textarea = editorRef.current;
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            let selectedText = textarea.value.substring(start, end);
            let newContent;
            let newSelectionStart;
            let newSelectionEnd;

            if (selectedText.length === 0) {
                // No selection, insert first number + defaultText
                newContent = `${startNumber}. ${defaultText}`;
                newSelectionStart = start + `${startNumber}. `.length;
                newSelectionEnd = newSelectionStart + defaultText.length;
            } else {
                // Multi-line selection
                const lines = selectedText.split('\n');
                let currentNum = startNumber;
                const prefixedLines = lines.map(line => {
                    // Only add prefix if line is not empty and doesn't already start with a number. + space
                    // This regex checks for "1. ", "2. ", etc. at the start of the line.
                    if (line.trim().length > 0 && !/^\d+\.\s/.test(line.trim())) {
                        return `${currentNum++}. ${line}`;
                    }
                    return line;
                });
                newContent = prefixedLines.join('\n');
                newSelectionStart = start;
                newSelectionEnd = start + newContent.length; // Select the newly formatted text
            }

            const newValue = textarea.value.substring(0, start) + newContent + textarea.value.substring(end);
            setContent(newValue);

            setTimeout(() => {
                textarea.focus();
                textarea.setSelectionRange(newSelectionStart, newSelectionEnd);
            }, 0);
          };

          const insertTaskList = (prefix, defaultText = '') => {
            const textarea = editorRef.current;
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            let selectedText = textarea.value.substring(start, end);
            let newContent;
            let newSelectionStart;
            let newSelectionEnd;

            if (selectedText.length === 0) {
                // No selection, insert prefix + defaultText
                newContent = prefix + defaultText;
                newSelectionStart = start + prefix.length;
                newSelectionEnd = newSelectionStart + defaultText.length;
            } else {
                // Multi-line selection
                const lines = selectedText.split('\n');
                const prefixedLines = lines.map(line => {
                    // Only add prefix if line is not empty and doesn't already start with the prefix
                    if (line.trim().length > 0 && !line.trim().startsWith(prefix.trim())) {
                        return prefix + line;
                    }
                    return line;
                });
                newContent = prefixedLines.join('\n');
                newSelectionStart = start;
                newSelectionEnd = start + newContent.length; // Select the newly formatted text
            }

            const newValue = textarea.value.substring(0, start) + newContent + textarea.value.substring(end);
            setContent(newValue);

            setTimeout(() => {
                textarea.focus();
                textarea.setSelectionRange(newSelectionStart, newSelectionEnd);
            }, 0);
          };

          // --- GitHub API Integration ---
          useEffect(() => {
            if (ghToken) {
              verifyGitHubToken(ghToken);
            }
          }, []);

          const apiRequest = async (endpoint, method = 'GET', body = null, customToken = null) => {
            const tokenToUse = customToken || ghToken;
            
            // Add timestamp to GET requests to prevent caching
            let url = `https://api.github.com${endpoint}`;
            if (method === 'GET') {
              const separator = url.includes('?') ? '&' : '?';
              url += `${separator}t=${new Date().getTime()}`;
            }

            const response = await fetch(url, {
              method,
              headers: {
                'Authorization': `token ${tokenToUse}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              cache: 'no-store',
              body: body ? JSON.stringify(body) : null
            });
            if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
            return response.json();
          };

          const verifyGitHubToken = async (token) => {
            setLoadingState('verifying');
            try {
              const user = await fetch('https://api.github.com/user', {
                headers: { 'Authorization': `token ${token}` }
              }).then(res => {
                if (!res.ok) throw new Error('Invalid Token');
                return res.json();
              });
              setGhToken(token);
              localStorage.setItem('gme_gh_token', token);
              setGhUser(user);
              setShowAuthModal(false);
              fetchRepos(token);
              showToast('Connected to GitHub');
            } catch (err) {
              localStorage.removeItem('gme_gh_token');
              setGhToken('');
              showToast('Invalid GitHub Token', 'error');
            }
            setLoadingState('');
          };

          const fetchRepos = async (tokenOverride = null) => {
            setLoadingState('fetching');
            try {
              // Tell GitHub to only send repos you own or are explicitly a collaborator on
              const data = await apiRequest('/user/repos?affiliation=owner,collaborator&sort=updated&per_page=100', 'GET', null, tokenOverride);
              
              // Strictly filter to ensure the push permission is explicitly true
              setRepos(Array.isArray(data) ? data.filter(repo => repo?.permissions?.push === true) : []);
            } catch (err) {
              showToast('Failed to fetch repositories', 'error');
            }
            setLoadingState('');
          };

          const fetchRepoContents = async (repoFullName, path = '') => {
            setLoadingState('fetching');
            try {
              const data = await apiRequest(`/repos/${repoFullName}/contents/${path}`);
              setRepoContents(Array.isArray(data) ? data.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
              }) : [data]);
              setCurrentRepo(repoFullName);
              if (path === '') setPathStack([]);
            } catch (err) {
              showToast('Failed to fetch folder contents', 'error');
            }
            setLoadingState('');
          };

          const getWorkspaceFiles = () => {
            if (currentRepo) {
              // Git Mode: Merge repoContents with pendingOps
              let files = repoContents.filter(f => !pendingOps[f.path] || pendingOps[f.path].action !== 'delete');
              
              // Add pending 'add' operations
              const pendingAdds = Object.values(pendingOps)
                .filter(op => op.action === 'add' && op.file)
                .map(op => ({ ...op.file, status: 'pending' }));
              
              files = [...files, ...pendingAdds];

              return files.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
              });
            } else {
              // Local Mode: Use localWorkspaceFiles
              return localWorkspaceFiles.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
              });
            }
          };

          const loadFile = async (file) => {
            if (file.type === 'dir') {
              setPathStack([...pathStack, file]);
              if (currentRepo) fetchRepoContents(currentRepo, file.path);
              return;
            }
            
            if (!file.name.match(/\.(md|txt|mdx)$/i)) {
              showToast('Only Markdown/Text files are supported', 'error');
              return;
            }

            if (!currentRepo) {
              // Local Workspace Mode
              setContent(file.content || '');
              setActiveFile(file);
              setLocalFileHandle(null);
              setLocalFileName('');
              return;
            }

            // Check if file is pending creation (optimistic load)
            const pendingOp = pendingOps[file.path];
            if (pendingOp && pendingOp.action === 'add') {
              if (pendingOp.content !== undefined) {
                setContent(pendingOp.content);
                setActiveFile(file);
                setLocalFileHandle(null);
                setLocalFileName('');
                return;
              } else {
                showToast('File is syncing, please wait...', 'info');
                return;
              }
            }

            setLoadingState('fetching');
            try {
              const data = await apiRequest(`/repos/${currentRepo}/contents/${file.path}`);
              const decodedContent = b64_to_utf8(data.content);
              setContent(decodedContent);
              setActiveFile({ path: file.path, sha: data.sha, name: file.name });
              setLocalFileHandle(null); // Clear local file context
              setLocalFileName('');     // Clear local file name
              showToast(`Loaded ${file.name}`);
            } catch (err) {
              showToast('Failed to load file', 'error');
            }
            setLoadingState('');
          };

          const navigateUp = () => {
            const newStack = [...pathStack];
            newStack.pop();
            setPathStack(newStack);
            const path = newStack.length > 0 ? newStack[newStack.length - 1].path : '';
            fetchRepoContents(currentRepo, path);
          };

          const saveToGitHub = async () => {
            // Use refs to get the latest state values
            const currentActiveFile = activeFileRef.current;
            const repoContext = currentRepoRef.current; // Use the ref for currentRepo

            if (!currentActiveFile) {
              return;
            }
            
            if (!repoContext) { // Use the ref for currentRepo here
              // Local Mode Save (Auto-Save to LocalStorage)
              const updated = localWorkspaceFiles.map(f => f.path === currentActiveFile.path ? { ...f, content: content } : f);
              setLocalWorkspaceFiles(updated);
              showToast('Saved locally');
              return;
            }

            // Git Mode Save -> Direct Commit
            setLoadingState('saving');
            try {
              const body = {
                message: `Update ${currentActiveFile.name} via Git Markdown Editor`,
                content: utf8_to_b64(content),
                sha: currentActiveFile.sha
              };
              const data = await apiRequest(`/repos/${repoContext}/contents/${currentActiveFile.path}`, 'PUT', body); // Use repoContext
              setActiveFile({ ...currentActiveFile, sha: data.content.sha });
              showToast('Successfully committed to GitHub!');
            } catch (err) {
              showToast('Failed to save to GitHub', 'error');
            }
            setLoadingState('');
          };

          const renameFile = async (fileToRename) => {
            const newName = prompt(`Rename ${fileToRename.name} to:`, fileToRename.name);
            if (!newName || newName === fileToRename.name) return;

            const currentPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
            const newPath = currentPath ? `${currentPath}/${newName}` : newName;

            if (!currentRepo) {
              // Local Mode Rename
              const existingFile = localWorkspaceFiles.find(f => f.path !== fileToRename.path && f.name === newName);
              if (existingFile) {
                showToast(`File with name '${newName}' already exists.`, 'error');
                return;
              }
              setLocalWorkspaceFiles(localWorkspaceFiles.map(f => 
                f.path === fileToRename.path ? { ...f, name: newName, path: newPath } : f
              ));
              if (activeFile?.path === fileToRename.path) {
                setActiveFile({ ...activeFile, name: newName, path: newPath });
              }
              showToast(`Renamed to ${newName}`);
              return;
            }

            // Git Mode Rename -> Optimistic Update
            // 1. Optimistic Update
            const newFile = { ...fileToRename, name: newName, path: newPath };
            
            setPendingOps(prev => ({
              ...prev,
              [fileToRename.path]: { action: 'delete' },
              [newPath]: { action: 'add', file: newFile }
            }));

            if (activeFile?.path === fileToRename.path) {
              setActiveFile(newFile);
            }
            showToast(`Renaming to ${newName}...`);

            // 2. Background API Call
            (async () => {
              try {
                // Get source content
                const sourceData = await apiRequest(`/repos/${currentRepo}/contents/${fileToRename.path}`);
                
                // Create new file
                const createBody = {
                  message: `Rename ${fileToRename.name} to ${newName} via Git Markdown Editor`,
                  content: sourceData.content.replace(/\n/g, ''), 
                };
                const createRes = await apiRequest(`/repos/${currentRepo}/contents/${newPath}`, 'PUT', createBody);

                // Delete old file
                const deleteBody = {
                  message: `Rename ${fileToRename.name} to ${newName} (cleanup) via Git Markdown Editor`,
                  sha: sourceData.sha
                };
                await apiRequest(`/repos/${currentRepo}/contents/${fileToRename.path}`, 'DELETE', deleteBody);

                // Success: Manually update repoContents
                setRepoContents(prev => {
                  const filtered = prev.filter(f => f.path !== fileToRename.path);
                  return [...filtered, { 
                    name: newName, 
                    path: newPath, 
                    type: 'file', 
                    sha: createRes.content.sha 
                  }].sort((a, b) => {
                     if (a.type === b.type) return a.name.localeCompare(b.name);
                     return a.type === 'dir' ? -1 : 1;
                  });
                });
                
                // Clean up pending ops
                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[fileToRename.path];
                  delete newState[newPath];
                  return newState;
                });
                
                showToast(`Renamed ${newName}`);
                
                const currentDirPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
                fetchRepoContents(currentRepo, currentDirPath);
                
                if (activeFile && activeFile.path === newPath) {
                  setActiveFile({ ...activeFile, sha: createRes.content.sha });
                }

              } catch (err) {
                console.error('Rename failed:', err);
                showToast(`Failed to rename: ${err.message || 'Unknown error'}`, 'error');
                // Revert ops
                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[fileToRename.path];
                  delete newState[newPath];
                  return newState;
                });
                // Revert active file if needed
                if (activeFile?.path === newPath) {
                  setActiveFile(fileToRename);
                }
              }
            })();
          };

          const deleteFile = async (fileToDelete) => {
            if (!confirm(`Delete ${fileToDelete.name}?`)) return;

            if (!currentRepo) {
              // Local Mode Delete
              setLocalWorkspaceFiles(localWorkspaceFiles.filter(f => f.path !== fileToDelete.path));
              if (activeFile?.path === fileToDelete.path) {
                setActiveFile(null);
                setContent('');
              }
              showToast(`Deleted ${fileToDelete.name}`);
              return;
            }

            // Git Mode Delete -> Optimistic Update
            // 1. Mark as pending delete
            setPendingOps(prev => ({
              ...prev,
              [fileToDelete.path]: { action: 'delete' }
            }));
            
            // 2. Clear active file if it was this one
            if (activeFile?.path === fileToDelete.path) {
              setActiveFile(null);
              setContent('');
            }
            showToast(`Deleting ${fileToDelete.name}...`);

            // 3. Background API Call
            (async () => {
              try {
                // If the file was just optimistically created and not synced yet, we just remove the op
                if (pendingOps[fileToDelete.path]?.action === 'add') {
                  setPendingOps(prev => {
                    const newState = { ...prev };
                    delete newState[fileToDelete.path];
                    return newState;
                  });
                  return;
                }

                // Normal Delete
                const body = {
                  message: `Delete ${fileToDelete.name} via Git Markdown Editor`,
                  sha: fileToDelete.sha,
                };
                await apiRequest(`/repos/${currentRepo}/contents/${fileToDelete.path}`, 'DELETE', body);

                // Optimistic UI: Manually remove file from repoContents
                setRepoContents(prev => prev.filter(f => f.path !== fileToDelete.path));

                // Clean up pending op
                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[fileToDelete.path];
                  return newState;
                });

                showToast(`Deleted ${fileToDelete.name}`);
                
                // Background refresh to ensure consistency
                const currentDirPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
                fetchRepoContents(currentRepo, currentDirPath);
              } catch (err) {
                console.error('Failed to delete file:', err);
                showToast(`Failed to delete ${fileToDelete.name}`, 'error');
                // Revert on error
                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[fileToDelete.path];
                  return newState;
                });
              }
            })();
          };

          const createFile = async (fileName, initialContent = '') => {
            const currentPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
            const filePath = currentPath ? `${currentPath}/${fileName}` : fileName;

            if (!currentRepo) {
              // Local Mode Create
              const existingFile = localWorkspaceFiles.find(f => f.name === fileName);
              if (existingFile) {
                showToast(`File '${fileName}' already exists.`, 'error');
                return;
              }
              const newFile = { 
                name: fileName, 
                path: filePath, 
                type: 'file', 
                content: initialContent 
              };
              setLocalWorkspaceFiles([...localWorkspaceFiles, newFile]);
              setActiveFile(newFile);
              setContent(initialContent);
              showToast(`Created ${fileName}`);
              return;
            }

            // Git Mode Create -> Optimistic Update + Background API
            // 1. Optimistic Update
            const tempFile = { name: fileName, path: filePath, type: 'file', sha: null, content: initialContent };
            
            // Set pending op
            setPendingOps(prev => ({
              ...prev,
              [filePath]: { action: 'add', file: tempFile, content: initialContent }
            }));
            
            // Set active (user can start editing immediately)
            setActiveFile(tempFile);
            setContent(initialContent);
            showToast(`Creating ${fileName}...`); // Informational

            // 2. Background API Call
            (async () => {
              try {
                const body = {
                  message: `Create ${fileName} via Git Markdown Editor`,
                  content: utf8_to_b64(initialContent),
                };
                const data = await apiRequest(`/repos/${currentRepo}/contents/${filePath}`, 'PUT', body);

                // Success: Manually update repoContents and clear pending op
                const newFileEntry = { name: fileName, path: filePath, type: 'file', sha: data.content.sha };
                
                setRepoContents(prev => {
                  // Avoid duplicates
                  const filtered = prev.filter(f => f.path !== filePath);
                  return [...filtered, newFileEntry].sort((a, b) => {
                     if (a.type === b.type) return a.name.localeCompare(b.name);
                     return a.type === 'dir' ? -1 : 1;
                  });
                });

                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[filePath];
                  return newState;
                });
                
                // If active file is still this one, update SHA
                setActiveFile(prev => prev && prev.path === filePath ? { ...prev, sha: data.content.sha } : prev);
                
                // Background refresh to ensure consistency
                fetchRepoContents(currentRepo, currentPath);
                showToast(`Synced ${fileName}`);
              } catch (err) {
                console.error('Failed to create file:', err);
                showToast(`Failed to create file: ${fileName}`, 'error');
                // Revert pending op on error
                setPendingOps(prev => {
                  const newState = { ...prev };
                  delete newState[filePath];
                  return newState;
                });
                // If active file was this one, clear it
                setActiveFile(prev => prev && prev.path === filePath ? null : prev);
              }
            })();
          };

          const handleNewFile = () => {
            const fileName = prompt('Enter new file name (e.g., my-doc.md):');
            if (fileName) {
              createFile(fileName, `# ${fileName.replace(/\.md$/, '')}\n\n`);
            }
          };

          // --- Local File Handlers ---
          const importLocalFile = async () => {
            if (!('showOpenFilePicker' in window)) {
              showToast('Browser not supported.', 'error');
              return;
            }
            try {
              const [handle] = await window.showOpenFilePicker({
                types: [{
                  description: 'Markdown Files',
                  accept: { 'text/markdown': ['.md', '.markdown', '.mdx', '.txt'] },
                }],
                multiple: false,
              });
              const file = await handle.getFile();
              const text = await file.text();
              
              // Import as "Create File"
              createFile(file.name, text);

            } catch (err) {
              if (err.name !== 'AbortError') {
                console.error('Failed to open local file:', err);
                showToast('Failed to open local file', 'error');
              }
            }
          };

          const handleSaveLocal = async (saveAs = false) => {
            if (!('showSaveFilePicker' in window)) {
               // Fallback for browsers without File System Access API (simple download)
               const blob = new Blob([content], { type: 'text/markdown' });
               const url = URL.createObjectURL(blob);
               const a = document.createElement('a');
               a.href = url;
               a.download = localFileName || 'untitled.md';
               a.click();
               URL.revokeObjectURL(url);
               showToast('File downloaded (Browser does not support direct save)');
               return;
            }

            try {
              let handle = localFileHandle;
              if (saveAs || !handle) {
                handle = await window.showSaveFilePicker({
                  suggestedName: localFileName || 'untitled.md',
                  types: [{
                    description: 'Markdown File',
                    accept: { 'text/markdown': ['.md'] },
                  }],
                });
              }
              const writable = await handle.createWritable();
              await writable.write(content);
              await writable.close();
              
              setLocalFileHandle(handle);
              setLocalFileName(handle.name);
              showToast(`Saved to ${handle.name}`);
            } catch (err) {
              if (err.name !== 'AbortError') {
                console.error('Failed to save local file:', err);
                showToast('Failed to save local file', 'error');
              }
            }
          };

          const handleDownload = () => {
            const fileName = activeFile?.name || localFileName || 'untitled.md';
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Downloaded ${fileName}`);
          };

          const handleExportPdf = () => {
            window.print();
          };

          const handleLogout = () => {
            setGhToken('');
            setGhUser(null);
            setRepos([]);
            setCurrentRepo(null);
            setActiveFile(null);
            localStorage.removeItem('gme_gh_token');
            showToast('Disconnected from GitHub');
          };

          return (
            <div className="flex h-screen w-full bg-white dark:bg-[#0d1117] text-gray-900 dark:text-gray-200 font-sans overflow-hidden selection:bg-indigo-500/30">
              
              {/* Toast Notification */}
              {toast && (
                <div className={`fixed top-4 right-4 z-50 flex items-center px-4 py-3 rounded-lg shadow-xl border ${
                  toast.type === 'error' ? 'bg-red-900/90 border-red-700 text-red-100' : 'bg-emerald-900/90 border-emerald-700 text-emerald-100'
                } transition-all duration-300 animate-in fade-in slide-in-from-top-4`}>
                  {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2" /> : <CheckCircle2 className="w-5 h-5 mr-2" />}
                  {toast.message}
                </div>
              )}

              {/* GitHub Auth Modal */}
              {showAuthModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                  <div className="bg-[#161b22] border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
                    <h2 className="text-xl font-bold mb-2 flex items-center">
                      <Github className="w-6 h-6 mr-2" /> Connect GitHub
                    </h2>
                    <p className="text-sm text-gray-400 mb-6">
                      Enter a Personal Access Token (classic) with <code className="bg-gray-800 px-1 rounded">repo</code> scope to sync files.
                    </p>
                    <input 
                      type="password" 
                      placeholder="ghp_xxxxxxxxxxxx" 
                      className="w-full bg-[#0d1117] border border-gray-700 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 mb-4 transition-all"
                      id="pat-input"
                      onKeyDown={(e) => e.key === 'Enter' && verifyGitHubToken(e.target.value)}
                    />
                    <div className="flex justify-end space-x-3">
                      <button 
                        onClick={() => setShowAuthModal(false)}
                        className="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition-colors"
                      >
                        Cancel
                      </button>
                      <button 
                        onClick={() => verifyGitHubToken(document.getElementById('pat-input').value)}
                        disabled={loadingState === 'verifying'}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center"
                      >
                        {loadingState === 'verifying' ? <Loader2 className="w-4 h-4 mr-2 animate-spin" /> : null}
                        Connect
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Sidebar */}
              <div id="main-sidebar" className="flex-shrink-0 bg-gray-50 dark:bg-[#161b22] border-r border-gray-200 dark:border-gray-800 flex flex-col transition-none overflow-hidden relative"                style={{ width: isSidebarOpen ? sidebarWidth : 0 }}
              >
                {/* Sidebar Header */}
                <div className="h-14 flex items-center justify-between px-4 border-b border-gray-200 dark:border-gray-800 shrink-0">
                  <span className="font-bold flex items-center text-gray-900 dark:text-gray-100 truncate">
                    <Github className="w-5 h-5 mr-2 text-indigo-600 dark:text-indigo-400 shrink-0" />
                    Explorer
                  </span>
                </div>

                {/* Sidebar Content */}
                <div className="flex-1 overflow-y-auto overflow-x-hidden p-3 space-y-4 custom-scrollbar">
                  
                  {/* GitHub Connection Area (Shown if not connected) */}
                  {!ghUser ? (

                .markdown-body h3 { font-size: 1.25rem; font-weight: 700; margin: 1.5rem 0 0.75rem; color: #374151; }
                .markdown-body p { margin-bottom: 1rem; line-height: 1.625; color: #4b5563; }
                .markdown-body a { color: #4f46e5; text-decoration: underline; text-underline-offset: 2px; }
                .markdown-body a:hover { color: #6366f1; }
                .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
                .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
                .markdown-body blockquote { border-left: 4px solid #4f46e5; padding: 0.25rem 0 0.25rem 1rem; margin: 1.5rem 0; color: #6b7280; background: #f9fafb; border-radius: 0 0.25rem 0.25rem 0; font-style: italic; }
                .markdown-body pre { background-color: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1.5rem 0; border: 1px solid #e5e7eb; }
                .markdown-body pre code { font-size: 0.875rem; font-family: monospace; color: #1f2937; background: transparent; padding: 0; }

                .markdown-body thead { background-color: #f9fafb; }
                .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.5rem 1rem; }

                .dark .markdown-body h2 { border-bottom: 1px solid #1f2937; color: #fff; }

                .dark .markdown-body input[type="checkbox"] { accent-color: #6366f1; }

                @media print {
                  @page {
                    size: a4 portrait;
                    margin: 20mm;
                  }

                  /* Hide sidebar, toolbars, editor, and resizers */
                  #main-sidebar,
                  #sidebar-resizer,
                  #top-toolbar,
                  #formatting-toolbar,
                  #editor-container,
                  #split-resizer {
                    display: none !important;
                  }

                    max-width: 100% !important;
                    overflow: visible !important; /* Allow content to flow */
                  }

                  /* The actual preview pane */
                  #preview-container {
                    width: 100% !important;
                    max-width: none !important;
                    padding: 0 !important;
                    margin: 0 !important;
                    background: white !important; /* Ensure white background for print */
                    overflow: visible !important;
                    flex: 1 1 100% !important;
                    height: auto !important;
                  }

                  /* Remove any box shadow and margin/padding from the inner content wrapper */
                  .max-w-3xl.mx-auto.w-full {
                    box-shadow: none !important;
                    padding: 0 !important;
                    margin: 0 auto !important; /* Keep it centered but remove extra margins */
                    max-width: 100% !important; /* Allow it to expand */
                    min-height: 0 !important;
                  }

                  /* Core Anti-Slicing Rules */
                  .markdown-body pre,
                  .markdown-body blockquote,
                  .markdown-body img,
                  .markdown-body table,
                  .markdown-body tr,
                  .markdown-body h1,
                  .markdown-body h2,
                  .markdown-body h3 {
                    page-break-inside: avoid !important;
                    break-inside: avoid !important;
                  }

                  /* Specific adjustments for KaTeX */
                  .katex-display-wrapper {
                    page-break-inside: avoid !important;
                    break-inside: avoid !important;
                  }

                  /* Ensure dark mode styles are ignored for print, force light */
                  .dark .markdown-body {
                    color: #1f2937 !important; /* Force light mode text color */
                  }
                  .dark .markdown-body h1 { color: #111827 !important; }
                  .dark .markdown-body h2 { border-bottom: 1px solid #e5e7eb !important; color: #111827 !important; }
                  .dark .markdown-body h3 { color: #374151 !important; }
                  .dark .markdown-body p { color: #4b5563 !important; }
                  .dark .markdown-body a { color: #4f46e5 !important; }
                  .dark .markdown-body a:hover { color: #6366f1 !important; }
                  .dark .markdown-body blockquote { border-left-color: #4f46e5 !important; color: #6b7280 !important; background: #f9fafb !important; }
                  .dark .markdown-body pre { background-color: #f3f4f6 !important; border-color: #e5e7eb !important; }
                  .dark .markdown-body pre code { color: #1f2937 !important; }
                  .dark .markdown-body code { background-color: #f3f4f6 !important; color: #db2777 !important; }
                  .dark .markdown-body thead { background-color: #f9fafb !important; }
                  .dark .markdown-body th, .dark .markdown-body td { border-color: #e5e7eb !important; }
                  .dark .markdown-body tr:nth-child(even) { background-color: #f9fafb !important; }
                  .dark .markdown-body del { color: #9ca3af !important; }
                  .dark .markdown-body input[type="checkbox"] { accent-color: #4f46e5 !important; }
                }
                /* End Print Styles */
              `}} />
            </div>
          );
        }

        // --- Helper Components ---
        function ToolButton({ icon, onClick, title }) {
          return (
            <button 
              onClick={onClick}
              title={title}
              className="p-1.5 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-gray-800 rounded transition-colors flex items-center justify-center shrink-0"
            >
              {icon}
            </button>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

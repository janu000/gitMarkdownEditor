<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkHub Editor</title>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Maps to load React and Icons natively in the browser -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- React will attach the app here -->
    <div id="root"></div>

    <!-- The actual React Application -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Github, FileText, Folder, Save, Eye, Edit3, Columns, 
          Bold, Italic, Link as LinkIcon, List, Image as ImageIcon, 
          Code, Heading1, Heading2, Quote, LogOut, Plus, ChevronRight,
          AlertCircle, CheckCircle2, Loader2, ArrowLeft, EyeOff, Trash2, RefreshCcw,
          CheckSquare, Strikethrough, Table, Sigma
        } from 'lucide-react';

        // --- Utility: Base64 Encoding with Unicode Support ---
        const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
        const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

        // --- Utility: Simple Markdown Parser (Fallback if marked.js fails) ---
        const fallbackParse = (md) => {
          if (!md) return '';
          let html = md.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-800 p-4 rounded-md overflow-x-auto my-4 text-sm font-mono text-gray-200"><code>$1</code></pre>');
          html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-800 px-1.5 py-0.5 rounded text-sm text-pink-400 font-mono">$1</code>');
          html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
          html = html.replace(/\*([^*]+)\*/g, '<em class="italic">$1</em>');
          html = html.replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-3 text-white">$1</h3>');
          html = html.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4 pb-2 border-b border-gray-700 text-white">$1</h2>');
          html = html.replace(/^# (.*$)/gim, '<h1 class="text-4xl font-extrabold mt-6 mb-6 text-white">$1</h1>');
          html = html.replace(/^\> (.*$)/gim, '<blockquote class="border-l-4 border-indigo-500 pl-4 py-1 my-4 text-gray-400 bg-gray-800/50 rounded-r">$1</blockquote>');
          html = html.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="max-w-full rounded-lg my-4 shadow-md" />');
          html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-2" target="_blank">$1</a>');
          html = html.replace(/^\s*-\s(.*$)/gim, '<li class="ml-4 list-disc mb-1">$1</li>');
          html = html.replace(/<\/li>\n<li/g, '</li><li'); 
          return `<div class="space-y-4 text-gray-300 leading-relaxed">${html.split('\n\n').map(p => {
            if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<blockquote') || p.startsWith('<li')) return p;
            return `<p>${p}</p>`;
          }).join('')}</div>`;
        };

        function App() {
          // --- Editor State ---
          const [content, setContent] = useState(() => localStorage.getItem('markhub_draft') || '# Welcome to MarkHub\n\nA powerful, browser-based Markdown editor with **GitHub Sync**.\n\n## Features\n- [x] Live WYSIWYG Preview\n- [x] GitHub Repository Sync\n- [ ] Export to PDF\n\n## Math & Tables\n\n| Feature | Status |\n| ------- | ------ |\n| Tables | Working! |\n| Math | Active |\n\nHere is your complex formula natively rendered:\nInline math: $P_{g,i} - P_{d,i} = \\sum_{j=1}^{N} |V_i||V_j||Y_{ij}| \\cos(\\theta_i - \\theta_j - \\delta_{ij})$\n\nBlock math:\n$$E = mc^2$$\n\n> "The best way to write documentation and notes."\n\n```javascript\n// Write code blocks easily\nconst editor = "awesome";\nconsole.log(editor);\n```');
          const [viewMode, setViewMode] = useState('split'); // 'split', 'edit', 'preview'
          const [parsedHtml, setParsedHtml] = useState('');
          const editorRef = useRef(null);
          const previewRef = useRef(null);

          // --- GitHub State ---
          const [ghToken, setGhToken] = useState(() => localStorage.getItem('gh_token') || '');
          const [ghUser, setGhUser] = useState(null);
          const [repos, setRepos] = useState([]);
          const [currentRepo, setCurrentRepo] = useState(null);
          const [repoContents, setRepoContents] = useState([]);
          const [pathStack, setPathStack] = useState([]); // Directory navigation stack
          const [activeFile, setActiveFile] = useState(null); // { path, sha, name }
          const [manualRepo, setManualRepo] = useState(''); // For manually entering owner/repo
          const [hiddenRepos, setHiddenRepos] = useState(() => JSON.parse(localStorage.getItem('markhub_hidden_repos') || '[]'));
          
          // --- UI State ---
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [loadingState, setLoadingState] = useState(''); // '', 'fetching', 'saving'
          const [toast, setToast] = useState(null); // { type, message }

          // --- Load External Markdown Parser & KaTeX ---
          useEffect(() => {
            // Load KaTeX CSS
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css';
            document.head.appendChild(link);

            // Sequential script loader to ensure correct dependency order
            const loadScript = (src) => new Promise((resolve) => {
              const script = document.createElement('script');
              script.src = src;
              script.onload = resolve;
              document.head.appendChild(script);
            });

            const initParser = async () => {
              await loadScript("https://cdn.jsdelivr.net/npm/marked/marked.min.js");
              await loadScript("https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js");
              
              if (window.marked && window.katex) {
                // Write a robust custom marked extension to ensure math overrides standard markdown (like italics and tables)
                const blockMath = {
                  name: 'blockMath',
                  level: 'block',
                  start(src) { return src.indexOf('$$'); },
                  tokenizer(src) {
                    const match = /^\$\$([\s\S]+?)\$\$/.exec(src);
                    if (match) return { type: 'blockMath', raw: match[0], text: match[1] };
                  },
                  renderer(token) {
                    return `<div class="katex-display-wrapper py-2">${window.katex.renderToString(token.text, { throwOnError: false, displayMode: true })}</div>`;
                  }
                };

                const inlineMath = {
                  name: 'inlineMath',
                  level: 'inline',
                  start(src) { return src.indexOf('$'); },
                  tokenizer(src) {
                    // Highly robust regex: matches $...$ but avoids matching things like "$5 and $10"
                    const match = /^\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$/.exec(src);
                    if (match) return { type: 'inlineMath', raw: match[0], text: match[1] };
                  },
                  renderer(token) {
                    return window.katex.renderToString(token.text, { throwOnError: false, displayMode: false });
                  }
                };

                window.marked.use({ extensions: [blockMath, inlineMath] });
                window.marked.setOptions({ gfm: true, breaks: true });
                
                // Re-run the preview update once the parser is fully loaded
                setContent(c => { updatePreview(c); return c; });
              }
            };

            initParser();
          }, []);

          // --- Autosave & Parsing ---
          useEffect(() => {
            localStorage.setItem('markhub_draft', content);
            updatePreview(content);
          }, [content]);

          const updatePreview = (md) => {
            if (window.marked && window.katex) {
              // By skipping manual replacements and using pure CSS, we ensure math components survive intact
              setParsedHtml(window.marked.parse(md));
            } else {
              setParsedHtml(fallbackParse(md));
            }
          };

          const showToast = (message, type = 'success') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3000);
          };

          // --- Sync Scrolling ---
          const handleScroll = (e) => {
            if (viewMode !== 'split') return;
            const { scrollTop, scrollHeight, clientHeight } = e.target;
            const scrollRatio = scrollTop / (scrollHeight - clientHeight);
            
            if (e.target === editorRef.current && previewRef.current) {
              previewRef.current.scrollTop = scrollRatio * (previewRef.current.scrollHeight - previewRef.current.clientHeight);
            } else if (e.target === previewRef.current && editorRef.current) {
              editorRef.current.scrollTop = scrollRatio * (editorRef.current.scrollHeight - editorRef.current.clientHeight);
            }
          };

          // --- Toolbar Actions ---
          const insertText = (before, after = '', defaultText = '') => {
            const textarea = editorRef.current;
            if (!textarea) return;
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end) || defaultText;
            
            const newText = textarea.value.substring(0, start) + before + selectedText + after + textarea.value.substring(end);
            setContent(newText);
            
            setTimeout(() => {
              textarea.focus();
              textarea.setSelectionRange(start + before.length, start + before.length + selectedText.length);
            }, 0);
          };

          // --- GitHub API Integration ---
          useEffect(() => {
            if (ghToken) {
              verifyGitHubToken(ghToken);
            }
          }, []);

          const apiRequest = async (endpoint, method = 'GET', body = null, customToken = null) => {
            const tokenToUse = customToken || ghToken;
            const response = await fetch(`https://api.github.com${endpoint}`, {
              method,
              headers: {
                'Authorization': `token ${tokenToUse}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              body: body ? JSON.stringify(body) : null
            });
            if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
            return response.json();
          };

          const verifyGitHubToken = async (token) => {
            setLoadingState('verifying');
            try {
              const user = await fetch('https://api.github.com/user', {
                headers: { 'Authorization': `token ${token}` }
              }).then(res => {
                if (!res.ok) throw new Error('Invalid Token');
                return res.json();
              });
              setGhToken(token);
              localStorage.setItem('gh_token', token);
              setGhUser(user);
              setShowAuthModal(false);
              fetchRepos(token);
              showToast('Connected to GitHub');
            } catch (err) {
              localStorage.removeItem('gh_token');
              setGhToken('');
              showToast('Invalid GitHub Token', 'error');
            }
            setLoadingState('');
          };

          const fetchRepos = async (tokenOverride = null) => {
            setLoadingState('fetching');
            try {
              // Tell GitHub to only send repos you own or are explicitly a collaborator on
              const data = await apiRequest('/user/repos?affiliation=owner,collaborator&sort=updated&per_page=100', 'GET', null, tokenOverride);
              
              // Strictly filter to ensure the push permission is explicitly true
              setRepos(Array.isArray(data) ? data.filter(repo => repo?.permissions?.push === true) : []);
            } catch (err) {
              showToast('Failed to fetch repositories', 'error');
            }
            setLoadingState('');
          };

          const fetchRepoContents = async (repoFullName, path = '') => {
            setLoadingState('fetching');
            try {
              const data = await apiRequest(`/repos/${repoFullName}/contents/${path}`);
              setRepoContents(Array.isArray(data) ? data.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
              }) : [data]);
              setCurrentRepo(repoFullName);
              if (path === '') setPathStack([]);
            } catch (err) {
              showToast('Failed to fetch folder contents', 'error');
            }
            setLoadingState('');
          };

          const loadFile = async (file) => {
            if (file.type === 'dir') {
              setPathStack([...pathStack, file]);
              fetchRepoContents(currentRepo, file.path);
              return;
            }
            
            if (!file.name.match(/\.(md|txt|mdx)$/i)) {
              showToast('Only Markdown/Text files are supported', 'error');
              return;
            }

            setLoadingState('fetching');
            try {
              const data = await apiRequest(`/repos/${currentRepo}/contents/${file.path}`);
              const decodedContent = b64_to_utf8(data.content);
              setContent(decodedContent);
              setActiveFile({ path: file.path, sha: data.sha, name: file.name });
              showToast(`Loaded ${file.name}`);
            } catch (err) {
              showToast('Failed to load file', 'error');
            }
            setLoadingState('');
          };

          const navigateUp = () => {
            const newStack = [...pathStack];
            newStack.pop();
            setPathStack(newStack);
            const path = newStack.length > 0 ? newStack[newStack.length - 1].path : '';
            fetchRepoContents(currentRepo, path);
          };

          const saveToGitHub = async () => {
            if (!activeFile || !currentRepo) {
              showToast('No active GitHub file to save. Create or open one first.', 'error');
              return;
            }
            setLoadingState('saving');
            try {
              const body = {
                message: `Update ${activeFile.name} via MarkHub`,
                content: utf8_to_b64(content),
                sha: activeFile.sha
              };
              const data = await apiRequest(`/repos/${currentRepo}/contents/${activeFile.path}`, 'PUT', body);
              setActiveFile({ ...activeFile, sha: data.content.sha });
              showToast('Successfully committed to GitHub!');
            } catch (err) {
              showToast('Failed to save to GitHub', 'error');
            }
            setLoadingState('');
          };

          const deleteFile = async (fileToDelete) => {
            if (!fileToDelete || !currentRepo) {
              showToast('No file selected for deletion.', 'error');
              return;
            }
            if (!confirm(`Are you sure you want to delete ${fileToDelete.name}? This action cannot be undone.`)) {
              return;
            }
            setLoadingState('deleting');
            try {
              const body = {
                message: `Delete ${fileToDelete.name} via MarkHub`,
                sha: fileToDelete.sha,
              };
              await apiRequest(`/repos/${currentRepo}/contents/${fileToDelete.path}`, 'DELETE', body);

              // Update state: refresh repo contents, clear active file if it was the one deleted
              showToast(`Successfully deleted ${fileToDelete.name}!`);
              // Re-fetch contents of the current directory to remove the deleted file from the list
              const currentDirPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
              fetchRepoContents(currentRepo, currentDirPath);

              if (activeFile && activeFile.path === fileToDelete.path) {
                setActiveFile(null);
                // Clear editor content and revert to default welcome message
                setContent('# Welcome to MarkHub\n\nA powerful, browser-based Markdown editor with **GitHub Sync**.\n\n## Features\n- [x] Live WYSIWYG Preview\n- [x] GitHub Repository Sync\n- [ ] Export to PDF\n\n## Math & Tables\n\n| Feature | Status |\n| ------- | ------ |\n| Tables | Working! |\n| Math | Active |\n\nHere is your complex formula natively rendered:\nInline math: $P_{g,i} - P_{d,i} = \\sum_{j=1}^{N} |V_i||V_j||Y_{ij}| \\cos(\\theta_i - \\theta_j - \\delta_{ij})$\n\nBlock math:\n$$E = mc^2$$\n\n> "The best way to write documentation and notes."\n\n```javascript\n// Write code blocks easily\nconst editor = "awesome";\nconsole.log(editor);\n```'); 
              }
            } catch (err) {
              console.error('Failed to delete file:', err);
              showToast(`Failed to delete ${fileToDelete.name}`, 'error');
            } finally {
              setLoadingState('');
            }
          };

          const createFile = async (fileName, initialContent = '') => {
            if (!currentRepo) {
              showToast('No repository selected.', 'error');
              return;
            }
            setLoadingState('saving');
            try {
              const currentPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
              const filePath = currentPath ? `${currentPath}/${fileName}` : fileName;

              const body = {
                message: `Create ${fileName} via MarkHub`,
                content: utf8_to_b64(initialContent),
              };
              const data = await apiRequest(`/repos/${currentRepo}/contents/${filePath}`, 'PUT', body);

              showToast(`Successfully created ${fileName}!`);
              // Refresh repo contents and open the new file
              fetchRepoContents(currentRepo, currentPath);
              setActiveFile({ path: filePath, sha: data.content.sha, name: fileName });
              setContent(initialContent);
            } catch (err) {
              console.error('Failed to create file:', err);
              showToast(`Failed to create file: ${fileName}`, 'error');
            }
            setLoadingState('');
          };

          const handleNewFile = () => {
            if (!currentRepo) {
              showToast('Please select a repository first.', 'error');
              return;
            }
            const fileName = prompt('Enter new file name (e.g., my-doc.md):');
            if (fileName) {
              createFile(fileName, `# ${fileName.replace(/\.md$/, '')}\n\n`);
            }
          };

          const handleLogout = () => {
            setGhToken('');
            setGhUser(null);
            setRepos([]);
            setCurrentRepo(null);
            setActiveFile(null);
            localStorage.removeItem('gh_token');
            showToast('Disconnected from GitHub');
          };

          return (
            <div className="flex h-screen w-full bg-[#0d1117] text-gray-200 font-sans overflow-hidden selection:bg-indigo-500/30">
              
              {/* Toast Notification */}
              {toast && (
                <div className={`fixed top-4 right-4 z-50 flex items-center px-4 py-3 rounded-lg shadow-xl border ${
                  toast.type === 'error' ? 'bg-red-900/90 border-red-700 text-red-100' : 'bg-emerald-900/90 border-emerald-700 text-emerald-100'
                } transition-all duration-300 animate-in fade-in slide-in-from-top-4`}>
                  {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2" /> : <CheckCircle2 className="w-5 h-5 mr-2" />}
                  {toast.message}
                </div>
              )}

              {/* GitHub Auth Modal */}
              {showAuthModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                  <div className="bg-[#161b22] border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
                    <h2 className="text-xl font-bold mb-2 flex items-center">
                      <Github className="w-6 h-6 mr-2" /> Connect GitHub
                    </h2>
                    <p className="text-sm text-gray-400 mb-6">
                      Enter a Personal Access Token (classic) with <code className="bg-gray-800 px-1 rounded">repo</code> scope to sync files.
                    </p>
                    <input 
                      type="password" 
                      placeholder="ghp_xxxxxxxxxxxx" 
                      className="w-full bg-[#0d1117] border border-gray-700 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 mb-4 transition-all"
                      id="pat-input"
                      onKeyDown={(e) => e.key === 'Enter' && verifyGitHubToken(e.target.value)}
                    />
                    <div className="flex justify-end space-x-3">
                      <button 
                        onClick={() => setShowAuthModal(false)}
                        className="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition-colors"
                      >
                        Cancel
                      </button>
                      <button 
                        onClick={() => verifyGitHubToken(document.getElementById('pat-input').value)}
                        disabled={loadingState === 'verifying'}
                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center"
                      >
                        {loadingState === 'verifying' ? <Loader2 className="w-4 h-4 mr-2 animate-spin" /> : null}
                        Connect
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Sidebar */}
              <div className={`${isSidebarOpen ? 'w-64' : 'w-0'} flex-shrink-0 bg-[#161b22] border-r border-gray-800 flex flex-col transition-all duration-300 overflow-hidden`}>
                {/* Sidebar Header */}
                <div className="h-14 flex items-center justify-between px-4 border-b border-gray-800 shrink-0">
                  <span className="font-bold flex items-center text-gray-100">
                    <Github className="w-5 h-5 mr-2 text-indigo-400" />
                    Explorer
                  </span>
                </div>

                {/* Sidebar Content */}
                <div className="flex-1 overflow-y-auto overflow-x-hidden p-3 space-y-4 custom-scrollbar">
                  
                  {/* GitHub Connection Area */}
                  {!ghUser ? (
                    <div className="bg-[#0d1117] border border-gray-800 p-4 rounded-lg text-center">
                      <Github className="w-8 h-8 mx-auto mb-3 text-gray-500" />
                      <p className="text-sm text-gray-400 mb-3">Sync files with your GitHub repositories.</p>
                      <button 
                        onClick={() => setShowAuthModal(true)}
                        className="w-full py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-sm font-medium transition-colors text-gray-200"
                      >
                        Connect Account
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {/* User Profile */}
                      <div className="flex items-center justify-between bg-[#0d1117] p-2 rounded-lg border border-gray-800">
                        <div className="flex items-center truncate">
                          <img src={ghUser.avatar_url} alt="Avatar" className="w-6 h-6 rounded-full mr-2" />
                          <span className="text-sm font-medium truncate">{ghUser.login}</span>
                        </div>
                        <button onClick={handleLogout} className="text-gray-500 hover:text-red-400 p-1 rounded" title="Disconnect">
                          <LogOut className="w-4 h-4" />
                        </button>
                      </div>

                      {/* Repo / File Browser */}
                      {!currentRepo ? (
                        <div>
                          <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 px-1">Repositories</h3>
                          {loadingState === 'fetching' ? (
                            <div className="flex justify-center p-4"><Loader2 className="w-5 h-5 animate-spin text-gray-500" /></div>
                          ) : (
                            <div className="space-y-4">
                              <ul className="space-y-1">
                                {repos.filter(r => !hiddenRepos.includes(r.full_name)).map(repo => (
                                  <li key={repo.id} className="flex items-center group">
                                    <button 
                                      onClick={() => fetchRepoContents(repo.full_name)}
                                      className="flex-1 flex items-center px-2 py-1.5 hover:bg-gray-800 rounded-l text-sm text-gray-300 transition-colors text-left overflow-hidden"
                                    >
                                      <Folder className="w-4 h-4 mr-2 text-indigo-400 shrink-0" />
                                      <span className="truncate">{repo.name}</span>
                                    </button>
                                    <button
                                      onClick={() => {
                                        const updated = [...hiddenRepos, repo.full_name];
                                        setHiddenRepos(updated);
                                        localStorage.setItem('markhub_hidden_repos', JSON.stringify(updated));
                                      }}
                                      className="opacity-0 group-hover:opacity-100 px-2 py-1.5 hover:bg-gray-700 text-gray-500 hover:text-red-400 transition-all rounded-r"
                                      title="Hide from list"
                                    >
                                      <EyeOff className="w-4 h-4" />
                                    </button>
                                  </li>
                                ))}
                                {repos.filter(r => !hiddenRepos.includes(r.full_name)).length === 0 && repos.length > 0 && (
                                  <p className="text-xs text-gray-500 italic px-2 py-1">All fetched repos are hidden.</p>
                                )}
                              </ul>

                              {hiddenRepos.length > 0 && (
                                <div className="px-1 -mt-2 mb-2">
                                  <button 
                                    onClick={() => { setHiddenRepos([]); localStorage.removeItem('markhub_hidden_repos'); }}
                                    className="text-[10px] uppercase tracking-wider text-gray-500 hover:text-indigo-400 transition-colors"
                                  >
                                    Restore {hiddenRepos.length} hidden repo{hiddenRepos.length !== 1 ? 's' : ''}
                                  </button>
                                </div>
                              )}

                              <div className="px-1 border-t border-gray-800 pt-3">
                                <p className="text-xs text-gray-500 mb-2">Can't see your repo? Enter manually:</p>
                                <div className="flex space-x-2">
                                  <input 
                                    type="text" 
                                    placeholder="owner/repo" 
                                    value={manualRepo}
                                    onChange={(e) => setManualRepo(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && manualRepo && fetchRepoContents(manualRepo)}
                                    className="flex-1 w-full bg-[#0d1117] border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500"
                                  />
                                  <button 
                                    onClick={() => manualRepo && fetchRepoContents(manualRepo)}
                                    disabled={!manualRepo}
                                    className="bg-gray-800 hover:bg-gray-700 disabled:opacity-50 px-3 py-1.5 rounded text-xs font-medium transition-colors text-gray-300"
                                  >
                                    Go
                                  </button>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <div className="flex items-center justify-between mb-2 px-1">
                            <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider truncate" title={currentRepo}>
                              {currentRepo}
                            </h3>
                            <div className="flex space-x-1">
                              <button
                                onClick={() => {
                                  const currentDirPath = pathStack.length > 0 ? pathStack[pathStack.length - 1].path : '';
                                  fetchRepoContents(currentRepo, currentDirPath);
                                }}
                                className="text-gray-400 hover:text-white text-xs bg-gray-800 px-1.5 py-0.5 rounded"
                                title="Refresh directory"
                              >
                                <RefreshCcw className="w-3 h-3" />
                              </button>
                              <button
                                onClick={() => handleNewFile()}
                                className="text-gray-400 hover:text-white text-xs bg-gray-800 px-1.5 py-0.5 rounded"
                                title="New file"
                              >
                                <Plus className="w-3 h-3" />
                              </button>
                              <button 
                                onClick={() => { setCurrentRepo(null); setPathStack([]); }}
                                className="text-gray-400 hover:text-white text-xs bg-gray-800 px-1.5 py-0.5 rounded"
                                title="Change repository"
                              >
                                Change
                              </button>
                            </div>
                          </div>
                          
                          {/* Breadcrumbs / Up */}
                          {pathStack.length > 0 && (
                            <button 
                              onClick={navigateUp}
                              className="w-full flex items-center px-2 py-1.5 hover:bg-gray-800 rounded text-sm text-gray-400 mb-1 transition-colors"
                            >
                              <ArrowLeft className="w-4 h-4 mr-2 shrink-0" />
                              <span className="truncate">.. / {pathStack[pathStack.length-1].name}</span>
                            </button>
                          )}

                          {/* File List */}
                          {loadingState === 'fetching' ? (
                            <div className="flex justify-center p-4"><Loader2 className="w-5 h-5 animate-spin text-gray-500" /></div>
                          ) : (
                            <ul className="space-y-1">
                              {repoContents.map(file => (
                                <li key={file.sha || file.path}>
                                  <div className="flex items-center group">
                                    <button 
                                      onClick={() => loadFile(file)}
                                      className={`flex-1 flex items-center px-2 py-1.5 rounded text-sm transition-colors text-left group min-w-0 ${
                                        activeFile?.path === file.path ? 'bg-indigo-500/20 text-indigo-300' : 'hover:bg-gray-800 text-gray-300'
                                      }`}
                                    >
                                      {file.type === 'dir' ? (
                                        <Folder className="w-4 h-4 mr-2 text-blue-400 shrink-0" />
                                      ) : (
                                        <FileText className="w-4 h-4 mr-2 text-gray-500 shrink-0" />
                                      )}
                                      <span className="flex-1 truncate min-w-0" title={file.name}>{file.name}</span>
                                    </button>
                                    {file.type === 'file' && (
                                      <button
                                        onClick={(e) => {
                                          e.stopPropagation(); // Prevent loadFile from being called
                                          deleteFile(file);
                                        }}
                                        className="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-red-900/50 text-gray-500 hover:text-red-400 transition-all rounded"
                                        title="Delete File"
                                        disabled={loadingState === 'deleting'}
                                      >
                                        <Trash2 className="w-4 h-4" />
                                      </button>
                                    )}
                                  </div>
                                </li>
                              ))}
                              {repoContents.length === 0 && <p className="text-xs text-gray-500 px-2 italic">Empty folder</p>}
                            </ul>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Main Content Area */}
              <div className="flex-1 flex flex-col min-w-0">
                
                {/* Top Toolbar */}
                <div className="h-14 bg-[#161b22] border-b border-gray-800 flex items-center justify-between px-4 shrink-0">
                  
                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                      className="p-1.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors mr-2"
                      title="Toggle Sidebar"
                    >
                      <Columns className="w-5 h-5" />
                    </button>
                    
                    {/* File Info */}
                    <div className="flex items-center text-sm">
                      {activeFile ? (
                        <>
                          <span className="text-gray-500">{currentRepo} / </span>
                          <span className="text-gray-200 ml-1 font-medium">{activeFile.name}</span>
                          {content !== localStorage.getItem('markhub_draft') && <span className="w-2 h-2 rounded-full bg-yellow-500 ml-2" title="Unsaved changes"></span>}
                        </>
                      ) : (
                        <span className="text-gray-500 italic">Local Draft (Unsynced)</span>
                      )}
                    </div>
                  </div>

                  {/* Action Buttons */}
                  <div className="flex items-center space-x-2">
                    {/* View Mode Toggles */}
                    <div className="flex bg-gray-900 rounded-lg p-0.5 border border-gray-700 mr-4">
                      <button 
                        onClick={() => setViewMode('edit')}
                        className={`p-1.5 rounded-md transition-all ${viewMode === 'edit' ? 'bg-gray-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                        title="Editor Only"
                      >
                        <Edit3 className="w-4 h-4" />
                      </button>
                      <button 
                        onClick={() => setViewMode('split')}
                        className={`p-1.5 rounded-md transition-all ${viewMode === 'split' ? 'bg-gray-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                        title="Split View"
                      >
                        <Columns className="w-4 h-4" />
                      </button>
                      <button 
                        onClick={() => setViewMode('preview')}
                        className={`p-1.5 rounded-md transition-all ${viewMode === 'preview' ? 'bg-gray-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                        title="Preview Only"
                      >
                        <Eye className="w-4 h-4" />
                      </button>
                    </div>

                    <button 
                      onClick={saveToGitHub}
                      disabled={!activeFile || loadingState === 'saving'}
                      className={`flex items-center px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        activeFile 
                          ? 'bg-indigo-600 hover:bg-indigo-700 text-white' 
                          : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                      }`}
                    >
                      {loadingState === 'saving' ? <Loader2 className="w-4 h-4 mr-2 animate-spin" /> : <Save className="w-4 h-4 mr-2" />}
                      Commit
                    </button>
                  </div>
                </div>

                {/* Formatting Toolbar */}
                {viewMode !== 'preview' && (
                  <div className="h-10 bg-[#0d1117] border-b border-gray-800 flex items-center px-4 space-x-1 overflow-x-auto shrink-0 custom-scrollbar">
                    <ToolButton icon={<Bold className="w-4 h-4" />} onClick={() => insertText('**', '**', 'bold text')} title="Bold" />
                    <ToolButton icon={<Italic className="w-4 h-4" />} onClick={() => insertText('*', '*', 'italic text')} title="Italic" />
                    <div className="w-px h-5 bg-gray-700 mx-1"></div>
                    <ToolButton icon={<Heading1 className="w-4 h-4" />} onClick={() => insertText('# ', '', 'Heading 1')} title="Heading 1" />
                    <ToolButton icon={<Heading2 className="w-4 h-4" />} onClick={() => insertText('## ', '', 'Heading 2')} title="Heading 2" />
                    <div className="w-px h-5 bg-gray-700 mx-1"></div>
                    <ToolButton icon={<List className="w-4 h-4" />} onClick={() => insertText('- ', '', 'List item')} title="Bullet List" />
                    <ToolButton icon={<CheckSquare className="w-4 h-4" />} onClick={() => insertText('- [ ] ', '', 'Task')} title="Task List" />
                    <ToolButton icon={<Quote className="w-4 h-4" />} onClick={() => insertText('> ', '', 'Quote')} title="Blockquote" />
                    <div className="w-px h-5 bg-gray-700 mx-1"></div>
                    <ToolButton icon={<LinkIcon className="w-4 h-4" />} onClick={() => insertText('[', '](url)', 'link text')} title="Link" />
                    <ToolButton icon={<ImageIcon className="w-4 h-4" />} onClick={() => insertText('![alt text](', ')', 'image url')} title="Image" />
                    <ToolButton icon={<Table className="w-4 h-4" />} onClick={() => insertText('\n| Header 1 | Header 2 |\n| -------- | -------- |\n| Cell 1   | Cell 2   |\n', '', '')} title="Table" />
                    <ToolButton icon={<Code className="w-4 h-4" />} onClick={() => insertText('```\n', '\n```', 'code block')} title="Code Block" />
                    <ToolButton icon={<Sigma className="w-4 h-4" />} onClick={() => insertText('$$\n', '\n$$', 'E = mc^2')} title="Math Block" />
                    <ToolButton icon={<Strikethrough className="w-4 h-4" />} onClick={() => insertText('~~', '~~', 'strikethrough text')} title="Strikethrough" />
                  </div>
                )}

                {/* Editor & Preview Area */}
                <div className="flex-1 flex overflow-hidden">
                  
                  {/* Editor Pane */}
                  {(viewMode === 'edit' || viewMode === 'split') && (
                    <div className={`flex-1 h-full flex flex-col bg-[#0d1117] ${viewMode === 'split' ? 'border-r border-gray-800' : ''}`}>
                      <textarea
                        ref={editorRef}
                        value={content}
                        onChange={(e) => setContent(e.target.value)}
                        onScroll={handleScroll}
                        className="flex-1 w-full bg-transparent text-gray-300 font-mono text-sm leading-relaxed p-6 resize-none focus:outline-none custom-scrollbar"
                        placeholder="Start typing your markdown here..."
                        spellCheck="false"
                      />
                    </div>
                  )}

                  {/* Preview Pane */}
                  {(viewMode === 'preview' || viewMode === 'split') && (
                    <div 
                      ref={previewRef}
                      onScroll={handleScroll}
                      className="flex-1 h-full bg-[#0d1117] overflow-y-auto p-8 custom-scrollbar relative"
                    >
                      <div className="max-w-3xl mx-auto w-full">
                        <div 
                          className="markdown-body text-gray-200"
                          dangerouslySetInnerHTML={{ __line: 1, __html: parsedHtml }}
                        />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Internal CSS for Scrollbars & Minor Tweaks */}
              <style dangerouslySetInnerHTML={{__html: `
                .custom-scrollbar::-webkit-scrollbar {
                  width: 8px;
                  height: 8px;
                }
                .custom-scrollbar::-webkit-scrollbar-track {
                  background: transparent;
                }
                .custom-scrollbar::-webkit-scrollbar-thumb {
                  background-color: #30363d;
                  border-radius: 4px;
                }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                  background-color: #484f58;
                }
                
                /* Markdown Global Styles */
                .markdown-body { color: #e5e7eb; }
                .markdown-body h1 { font-size: 2.25rem; font-weight: 800; margin: 2rem 0 1.5rem; color: #fff; letter-spacing: -0.025em; }
                .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin: 2.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #1f2937; color: #fff; }
                .markdown-body h3 { font-size: 1.25rem; font-weight: 700; margin: 1.5rem 0 0.75rem; color: #f3f4f6; }
                .markdown-body p { margin-bottom: 1rem; line-height: 1.625; color: #d1d5db; }
                .markdown-body a { color: #818cf8; text-decoration: underline; text-underline-offset: 2px; }
                .markdown-body a:hover { color: #a5b4fc; }
                .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
                .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
                .markdown-body blockquote { border-left: 4px solid #6366f1; padding: 0.25rem 0 0.25rem 1rem; margin: 1.5rem 0; color: #9ca3af; background: rgba(31, 41, 55, 0.3); border-radius: 0 0.25rem 0.25rem 0; font-style: italic; }
                .markdown-body pre { background-color: #1e1e1e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1.5rem 0; border: 1px solid #1f2937; }
                .markdown-body pre code { font-size: 0.875rem; font-family: monospace; color: #e5e7eb; background: transparent; padding: 0; }
                .markdown-body code { background-color: #1f2937; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; color: #f472b6; font-family: monospace; }
                .markdown-body table { width: 100%; text-align: left; border-collapse: collapse; margin: 1.5rem 0; }
                .markdown-body thead { background-color: #1f2937; }
                .markdown-body th, .markdown-body td { border: 1px solid #374151; padding: 0.5rem 1rem; }
                .markdown-body tr:nth-child(even) { background-color: rgba(31, 41, 55, 0.3); }
                .markdown-body del { text-decoration: line-through; color: #6b7280; }
                .markdown-body input[type="checkbox"] { margin-right: 0.5rem; accent-color: #6366f1; transform: translateY(0.125rem); }
                .markdown-body li.task-list-item { list-style: none; margin-left: -1.5rem; display: flex; align-items: flex-start; }
                .katex-display { overflow-x: auto; padding: 0.5rem 0; }
              `}} />
            </div>
          );
        }

        // --- Helper Components ---
        function ToolButton({ icon, onClick, title }) {
          return (
            <button 
              onClick={onClick}
              title={title}
              className="p-1.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors flex items-center justify-center shrink-0"
            >
              {icon}
            </button>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

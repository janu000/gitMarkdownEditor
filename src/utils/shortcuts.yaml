# Default Keyboard Shortcuts for Git Markdown Editor
# Format: action: key_combination
# Modifiers: mod (Ctrl/Cmd), shift, alt

save: mod+s
print: mod+p
bold: mod+b
italic: mod+i
strikethrough: mod+shift+s
link: mod+k
image: mod+alt+i
unordered_list: mod+shift+u
numbered_list: mod+shift+o
task_list: mod+shift+l
quote: mod+shift+q
code_block: mod+alt+c
inline_code: mod+alt+`
table: mod+alt+t
math_block: mod+alt+x
